// --- MÚSICA DE FONDO ---
let audioCtx, isPlayingMusic = false, musicInterval;
const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
function toggleMusic() {
  const btn = document.getElementById('musicBtn');
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (isPlayingMusic) {
    clearInterval(musicInterval); isPlayingMusic = false; btn.innerText = "🔇"; btn.style.background = "#ff7675";
  } else {
    isPlayingMusic = true; btn.innerText = "🎵"; btn.style.background = "#a29bfe";
    playMelody(); musicInterval = setInterval(playMelody, 4000);
  }
}
function playMelody() {
  if(audioCtx.state === 'suspended') audioCtx.resume();
  const melody = [0, 2, 4, 5, 4, 2, 1, 0]; let delay = 0;
  melody.forEach((noteIndex) => {
    const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = notes[noteIndex];
    osc.connect(gainNode); gainNode.connect(audioCtx.destination);
    gainNode.gain.setValueAtTime(0, audioCtx.currentTime + delay);
    gainNode.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + delay + 0.1);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + 1);
    osc.start(audioCtx.currentTime + delay); osc.stop(audioCtx.currentTime + delay + 1);
    delay += 0.5;
  });
}

};

let currentBook = null;
let currentPage = 0;
let isReading = false;

function openBook(id) {
  if(isPlayingMusic) toggleMusic();
  
  currentBook = books[id];
  currentPage = 0;
  document.getElementById('menu').style.display = 'none';
  document.getElementById('main-title').style.display = 'none';
  document.getElementById('viewer').classList.add('active');
  renderPage(true); 
}

function closeBook() {
  document.getElementById('viewer').classList.remove('active');
  document.getElementById('menu').style.display = 'flex';
  document.getElementById('main-title').style.display = 'block';
  window.speechSynthesis.cancel();
}

function renderPage(autoPlay = false) {
  window.speechSynthesis.cancel();
  document.getElementById('book-title').innerText = currentBook.title;
  
  const imgElement = document.getElementById('page-img');
  imgElement.src = currentBook.folder + "/" + currentBook.folder + "-" + (currentPage + 1) + ".png";
  imgElement.style.display = 'block';
  
  document.getElementById('page-text').innerText = currentBook.pages[currentPage];

  if(autoPlay) {
    setTimeout(speakText, 600); 
  }
}

function nextPage() {
  if (currentPage < currentBook.pages.length - 1) {
    currentPage++;
    renderPage(true);
  }
}

function prevPage() {
  if (currentPage > 0) {
    currentPage--;
    renderPage(true);
  }
}

function speakText() {
  window.speechSynthesis.cancel();
  const text = currentBook.pages[currentPage];
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'es-ES';
  utterance.rate = 0.95;
  
  const voices = window.speechSynthesis.getVoices();
  const spanishVoice = voices.find(voice => voice.lang.includes('es'));
  if (spanishVoice) {
    utterance.voice = spanishVoice;
  }
  
  window.speechSynthesis.speak(utterance);
}
</script>
</body>
